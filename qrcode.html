<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">⚙️ Painel Operacional</div>
    <div class="navbar-links">
        <a href="index.html" class="nav-link">🏠 Início</a>
        <a href="pedidos.html" class="nav-link">📦 Pedidos</a>
        <a href="qrcode.html" class="nav-link active">🔲 QR Code</a>
    </div>
</nav>

<div class="container">
    <h1>Gerador de QR Code</h1>
    <div class="card-op">
        <div class="grupo">
            <label for="op">Ordem de Produção (OP)</label>
            <input type="text" id="op" value="010227001119">
        </div>
        <div class="grupo">
            <label for="PA">Código PA</label>
            <input type="text" id="PA" value="PAA2596CDZ">
        </div>
    </div>
    <div class="card-ct">
        <h2>Centro de Trabalho 1</h2>
        <div class="linha">
            <div class="grupo">
                <label for="Centro_de_Trabalho">Centro</label>
                <input type="text" id="Centro_de_Trabalho" value="5">
            </div>
            <div class="grupo">
                <label for="PT">Ponto</label>
                <input type="text" id="PT" value="6.6">
            </div>
            <div class="grupo">
                <label for="campo1">Quantidade</label>
                <input type="text" id="campo1" value="1">
            </div>
        </div>
    </div>
    <div class="card-ct">
        <h2>Centro de Trabalho 2</h2>
        <div class="linha">
            <div class="grupo">
                <label for="campo2">Centro</label>
                <input type="text" id="campo2" value="21">
            </div>
            <div class="grupo">
                <label for="campo3">Ponto</label>
                <input type="text" id="campo3" value="3.15">
            </div>
            <div class="grupo">
                <label for="campo4">Quantidade</label>
                <input type="text" id="campo4" value="1">
            </div>
        </div>
    </div>
    <div class="card-ct">
        <h2>Centro de Trabalho 3</h2>
        <div class="linha">
            <div class="grupo">
                <label for="campo5">Centro</label>
                <input type="text" id="campo5" value="32">
            </div>
            <div class="grupo">
                <label for="campo6">Ponto</label>
                <input type="text" id="campo6" value="4.1">
            </div>
            <div class="grupo">
                <label for="campo7">Quantidade</label>
                <input type="text" id="campo7" value="1">
            </div>
        </div>
    </div>
    <button onclick="gerarQRCode()">Gerar QR Code</button>
    <div id="textoGerado"></div>
    <div id="qrcode"></div>
</div>

<script src="script.js"></script>
</body>
</html>
