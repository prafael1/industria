<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Operacional</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">⚙️ Painel Operacional</div>
    <div class="navbar-links">
        <a href="index.html" class="nav-link active">🏠 Início</a>
        <a href="pedidos.html" class="nav-link">📦 Pedidos</a>
        <a href="qrcode.html" class="nav-link">🔲 QR Code</a>
    </div>
</nav>

<div class="container">
    <h1>Agendamentos do Dia</h1>

    <div id="tabela-wrap">
        <table class="tabela-pedidos">
            <thead>
                <tr>
                    <th>Nº Pedido</th>
                    <th>Cliente</th>
                    <th>Carga</th>
                    <th>Agendamento</th>
                    <th>Cidade</th>
                    <th>Dt. Carregamento</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabela-body"></tbody>
        </table>
        <div id="empty-state">Nenhum agendamento cadastrado.</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBhAtHE0lwpCH_MIlLGzd4iiM-lNAZjKiA",
        authDomain: "pedidos-empresa-59c1d.firebaseapp.com",
        databaseURL: "https://pedidos-empresa-59c1d-default-rtdb.firebaseio.com",
        projectId: "pedidos-empresa-59c1d",
        storageBucket: "pedidos-empresa-59c1d.firebasestorage.app",
        messagingSenderId: "21893151339",
        appId: "1:21893151339:web:a6a1f995eeba30f0278f2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusMap = {
        aguardando: { label: "Aguardando Prog.", cls: "status-aguardando" },
        produzindo:  { label: "Produzindo",       cls: "status-produzindo"  },
        produzido:   { label: "Produzido",         cls: "status-produzido"   },
        doca:        { label: "Na Doca",           cls: "status-doca"        },
        carregado:   { label: "Carregado",         cls: "status-carregado"   },
    };

    function formatDate(val) {
        if (!val) return "—";
        const [y, m, d] = val.split("-");
        return `${d}/${m}/${y}`;
    }

    onValue(ref(db, "pedidos"), (snapshot) => {
        const tbody = document.getElementById("tabela-body");
        const empty = document.getElementById("empty-state");
        tbody.innerHTML = "";

        const data = snapshot.val();
        if (!data) {
            empty.style.display = "block";
            return;
        }

        empty.style.display = "none";
        Object.values(data).forEach(p => {
            const s = statusMap[p.status] || statusMap["aguardando"];
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${p.pedido || "—"}</strong></td>
                <td>${p.cliente || "—"}</td>
                <td>${p.carga || "—"}</td>
                <td>${formatDate(p.agendamento)}</td>
                <td>${p.cidade || "—"}</td>
                <td>${formatDate(p.datacarreg)}</td>
                <td><span class="status ${s.cls}">${s.label}</span></td>
            `;
            tbody.appendChild(tr);
        });
    });
</script>

</body>
</html>
